[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "erp-control-arena"
version = "0.1.0"
description = "ERP accounts-payable ControlArena setting (proof of concept)"
requires-python = ">=3.11"
dependencies = [
    "control-arena",
    "inspect-ai",
    "pydantic",
    "pandas",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["erp_setting*"]

[project.scripts]
run-eval = "scripts.run_eval:main"
analyze = "scripts.analyze:main"
